<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="520" height="220" fill="none">
  <!-- Фон картки -->
  <rect width="520" height="220" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  
  <text x="20" y="32" fill="#38BDF8" font-family="Inter, sans-serif" font-size="13" font-weight="bold" letter-spacing="1">МАРКУВАННЯ РЕЗИСТОРА 220 ОМ (COLOR CODE)</text>

  <!-- Металеві виводи резистора -->
  <line x1="30" y1="100" x2="130" y2="100" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
  <line x1="290" y1="100" x2="490" y2="100" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>

  <!-- Керамічний корпус -->
  <rect x="130" y="72" width="160" height="56" rx="16" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <ellipse cx="138" cy="100" rx="6" ry="26" fill="#F59E0B" opacity="0.6"/>
  <ellipse cx="282" cy="100" rx="6" ry="26" fill="#F59E0B" opacity="0.6"/>

  <!-- Кольорові смуги 220 Ом (Червоний - Червоний - Коричневий - Золотий) -->
  <!-- Смуга 1: Червона (цифра 2) -->
  <rect x="160" y="72" width="12" height="56" fill="#EF4444"/>
  <!-- Смуга 2: Червона (цифра 2) -->
  <rect x="186" y="72" width="12" height="56" fill="#EF4444"/>
  <!-- Смуга 3: Коричнева (множник x10) -->
  <rect x="214" y="72" width="12" height="56" fill="#92400E"/>
  <!-- Смуга 4: Золота (точність ±5%) -->
  <rect x="250" y="72" width="10" height="56" fill="#F59E0B"/>

  <!-- Стрілочки і розшифровка смуг -->
  <g font-family="Inter, sans-serif" font-size="11" text-anchor="middle">
    <!-- Смуга 1 -->
    <line x1="166" y1="134" x2="166" y2="160" stroke="#EF4444" stroke-width="1.5"/>
    <text x="166" y="174" fill="#FCA5A5" font-weight="bold">2</text>
    <text x="166" y="188" fill="#94A3B8" font-size="9">1-а цифра</text>

    <!-- Смуга 2 -->
    <line x1="192" y1="134" x2="192" y2="160" stroke="#EF4444" stroke-width="1.5"/>
    <text x="192" y="174" fill="#FCA5A5" font-weight="bold">2</text>
    <text x="192" y="188" fill="#94A3B8" font-size="9">2-а цифра</text>

    <!-- Смуга 3 -->
    <line x1="220" y1="134" x2="220" y2="160" stroke="#D97706" stroke-width="1.5"/>
    <text x="220" y="174" fill="#FCD34D" font-weight="bold">×10</text>
    <text x="220" y="188" fill="#94A3B8" font-size="9">Множник</text>

    <!-- Смуга 4 -->
    <line x1="255" y1="134" x2="255" y2="160" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="255" y="174" fill="#FBBF24" font-weight="bold">±5%</text>
    <text x="255" y="188" fill="#94A3B8" font-size="9">Точність</text>
  </g>

  <!-- Результат формули праворуч -->
  <rect x="330" y="60" width="170" height="76" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="415" y="85" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">ФОРМУЛА ОПОРУ:</text>
  <text x="415" y="108" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" text-anchor="middle">22 × 10 = 220 Ω</text>
  <text x="415" y="125" fill="#4ADE80" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">✓ Безпечно для LED</text>
</svg>
