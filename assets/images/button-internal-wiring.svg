<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240" fill="none">
  <rect width="500" height="240" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="20" y="32" fill="#38BDF8" font-family="Inter, sans-serif" font-size="13" font-weight="bold" letter-spacing="1">БУДОВА 4-ПІНОВОЇ ТАКТОВОЇ КНОПКИ</text>
  
  <g transform="translate(60, 60)">
    <!-- Корпус кнопки -->
    <rect width="100" height="100" rx="8" fill="#0F172A" stroke="#475569" stroke-width="2"/>
    <!-- Кругла кнопка -->
    <circle cx="50" cy="50" r="28" fill="#334155" stroke="#64748B" stroke-width="2"/>
    <circle cx="50" cy="50" r="18" fill="#1E293B"/>

    <!-- 4 металеві виводи -->
    <rect x="-15" y="20" width="15" height="8" rx="2" fill="#CBD5E1"/>
    <rect x="-15" y="72" width="15" height="8" rx="2" fill="#CBD5E1"/>
    <rect x="100" y="20" width="15" height="8" rx="2" fill="#CBD5E1"/>
    <rect x="100" y="72" width="15" height="8" rx="2" fill="#CBD5E1"/>

    <!-- Маркування виводів -->
    <text x="-28" y="28" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">1</text>
    <text x="-28" y="80" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">2</text>
    <text x="120" y="28" fill="#EF4444" font-family="monospace" font-size="11" font-weight="bold">3</text>
    <text x="120" y="80" fill="#EF4444" font-family="monospace" font-size="11" font-weight="bold">4</text>
  </g>

  <!-- Пояснення з'єднання -->
  <g transform="translate(230, 70)" font-family="Inter, sans-serif" font-size="12">
    <text x="0" y="20" fill="#F8FAFC" font-weight="bold">Внутрішні контакти кнопки:</text>
    <text x="0" y="42" fill="#94A3B8">• Піни 1 та 3 постійно з'єднані всередині</text>
    <text x="0" y="62" fill="#94A3B8">• Піни 2 та 4 постійно з'єднані всередині</text>
    <text x="0" y="90" fill="#38BDF8" font-weight="bold">При натисканні:</text>
    <text x="0" y="110" fill="#F1F5F9">Пара (1-3) замикається з парою (2-4)!</text>
    <text x="0" y="130" fill="#34D399" font-size="11">💡 Підключайте дроти по діагоналі (1 та 4)</text>
  </g>
</svg>