<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240" fill="none">
  <rect width="500" height="240" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="20" y="32" fill="#38BDF8" font-family="Inter, sans-serif" font-size="13" font-weight="bold" letter-spacing="1">СХЕМА ДІЛЬНИКА НАПРУГИ (VOLTAGE DIVIDER)</text>

  <!-- Схема дільника -->
  <g transform="translate(60, 50)" font-family="monospace" font-size="11">
    <!-- 5V зверху -->
    <circle cx="80" cy="15" r="5" fill="#EF4444"/>
    <text x="95" y="19" fill="#EF4444" font-weight="bold">+5V (Живлення)</text>
    <line x1="80" y1="20" x2="80" y2="40" stroke="#EF4444" stroke-width="3"/>

    <!-- Фоторезистор LDR (R1) -->
    <rect x="68" y="40" width="24" height="40" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="80" cy="60" r="6" fill="#0284C7"/>
    <text x="100" y="65" fill="#38BDF8" font-family="Inter, sans-serif" font-size="11" font-weight="bold">R1: Фоторезистор (GL5528)</text>

    <!-- Середня точка A0 -->
    <line x1="80" y1="80" x2="80" y2="110" stroke="#F1F5F9" stroke-width="3"/>
    <circle cx="80" cy="95" r="5" fill="#38BDF8"/>
    <line x1="80" y1="95" x2="160" y2="95" stroke="#38BDF8" stroke-width="3" stroke-dasharray="4 3"/>
    <circle cx="160" cy="95" r="5" fill="#38BDF8"/>
    <text x="175" y="99" fill="#38BDF8" font-family="Inter, sans-serif" font-size="12" font-weight="bold">-> Сигнал на пін A0</text>

    <!-- Постійний резистор R2 (10 кОм) -->
    <rect x="68" y="110" width="24" height="40" rx="4" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
    <text x="100" y="135" fill="#FBBF24" font-family="Inter, sans-serif" font-size="11" font-weight="bold">R2: 10 кОм (Постійний)</text>
    <line x1="80" y1="150" x2="80" y2="170" stroke="#64748B" stroke-width="3"/>

    <!-- GND знизу -->
    <line x1="65" y1="170" x2="95" y2="170" stroke="#94A3B8" stroke-width="3"/>
    <line x1="70" y1="175" x2="90" y2="175" stroke="#94A3B8" stroke-width="2"/>
    <line x1="75" y1="180" x2="85" y2="180" stroke="#94A3B8" stroke-width="2"/>
    <text x="105" y="175" fill="#94A3B8">GND (Земля)</text>
  </g>
</svg>